name: Build

on:
  push:
    branches: [main, master]
  pull_request:

# Castle.Sdk 3.0.0 is on castle-dotnet develop but not yet on NuGet, so the
# samples are built from that source via scripts/set-sdk-version.sh. Once 3.0.0
# is published, remove the "Build Castle.Sdk from source" steps so the samples
# restore Castle.Sdk straight from NuGet.
jobs:
  core:
    name: ASP.NET Core sample (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Build Castle.Sdk from develop
        run: ./scripts/set-sdk-version.sh develop
      - run: dotnet build src/CastleDemo/CastleDemo.csproj -c Release

  framework:
    name: .NET Framework sample (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Build Castle.Sdk from develop
        run: ./scripts/set-sdk-version.sh develop
        shell: bash
      - run: dotnet build src/CastleDemo.Framework/CastleDemo.Framework.csproj -c Release
